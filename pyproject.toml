[project]
name = "gitnexus-cgc-combo"
version = "0.1.0"
description = "Code Intelligence Bootstrap Kit — agent-provisioned GitNexus + CodeGraphContext for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Joey Chiu" }
]
license = { text = "MIT" }
keywords = ["gitnexus", "codegraphcontext", "cgc", "code-intelligence", "mcp", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

dependencies = [
    "codegraphcontext>=0.4.11",
]

[project.scripts]
combo-setup = "src.config_gen:main"

[project.urls]
Homepage = "https://github.com/Im-Busy/gitnexus-cgc-combo"
Repository = "https://github.com/Im-Busy/gitnexus-cgc-combo"
Issues = "https://github.com/Im-Busy/gitnexus-cgc-combo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"platforms/matrix.json" = "platforms/matrix.json"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".codebuddy/",
    ".codex/",
    ".continue/",
    ".cursor/",
    ".factory/",
    ".gemini/",
    ".hermes/",
    ".kilo/",
    ".kiro/",
    ".mastracode/",
    ".opencode/",
    ".pi/",
    ".vscode/",
    ".cgcignore",
    ".npmignore",
    "AGENTS.md",
    "CLAUDE.md",
    "cli.js",
    "package.json",
    "uv.lock",
    ".gitnexus/",
    ".cgc/",
    ".venv/",
    "node_modules/",
    "progress_docs/",
    "whitelist.txt",
    "dist/",
]

[tool.uv]
package = true
